<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Endless House</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='5' y='2' width='6' height='13' fill='%232A1E17' stroke='%23B08D57' stroke-width='.6'/%3E%3Crect x='5' y='14.4' width='6' height='.6' fill='%23FFB36B'/%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      #start {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #000;
        color: #d8d2c4;
        font-family: Georgia, 'Times New Roman', serif;
        cursor: pointer;
        user-select: none;
        transition: opacity 0.8s ease;
      }
      #start h1 {
        margin: 0;
        font-size: 13px;
        font-weight: normal;
        letter-spacing: 0.35em;
      }
      #start p {
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.2em;
        opacity: 0.45;
      }
      #start.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #dot {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 3px;
        height: 3px;
        margin: -1.5px 0 0 -1.5px;
        border-radius: 50%;
        background: #d8d2c4;
        opacity: 0.45;
        pointer-events: none;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      #dot.focus {
        opacity: 0.95;
        transform: scale(1.6);
      }
      #glyph {
        position: fixed;
        left: calc(50% + 12px);
        top: 50%;
        transform: translateY(-50%);
        color: #d8d2c4;
        font:
          10px Georgia,
          'Times New Roman',
          serif;
        letter-spacing: 0.1em;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      #glyph.focus {
        opacity: 0.6;
      }
      /* Developer diagnostics (backtick). Not part of the experience. */
      #diagnostics {
        position: fixed;
        top: 12px;
        left: 12px;
        margin: 0;
        padding: 10px 12px;
        max-width: calc(100vw - 48px);
        background: rgba(0, 0, 0, 0.72);
        color: #cfd8d4;
        font:
          11px/1.45 ui-monospace,
          Consolas,
          monospace;
        white-space: pre-wrap;
        word-break: break-all;
        pointer-events: none;
        z-index: 10;
      }
      /* The transition haze: not a loading screen. No spinner, no text. */
      #haze {
        position: fixed;
        inset: 0;
        background: #ffe6c4;
        opacity: 0;
        pointer-events: none;
        transition: opacity 1.5s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="dot"></div>
    <div id="glyph">E</div>
    <div id="haze"></div>
    <pre id="diagnostics" hidden></pre>
    <div id="start">
      <h1>THE ENDLESS HOUSE</h1>
      <p>click to enter</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
